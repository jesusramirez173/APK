name: Construir APK Mundo Cases

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Compilar APK Android
    runs-on: ubuntu-22.04

    steps:
      - name: Descargar Código del Repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Instalar Dependencias Web y Capacitor
        run: |
          npm install

      - name: Compilar Aplicación Web (Vite + React)
        run: |
          npm run build

      - name: Configurar Java 17 (JDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Android SDK manualmente
        run: |
          # Descargar Android command-line tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O /tmp/cmdtools.zip
          mkdir -p $HOME/android-sdk/cmdline-tools
          unzip -q /tmp/cmdtools.zip -d $HOME/android-sdk/cmdline-tools
          mv $HOME/android-sdk/cmdline-tools/cmdline-tools $HOME/android-sdk/cmdline-tools/latest

          # Exportar variables de entorno
          echo "ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> $GITHUB_ENV
          echo "$HOME/android-sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$HOME/android-sdk/platform-tools" >> $GITHUB_PATH

      - name: Instalar Plataformas y Build Tools de Android
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Inicializar y Sincronizar Proyecto Android
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Otorgar Permisos de Ejecución a Gradle
        run: |
          chmod +x android/gradlew

      - name: Compilar APK (assembleDebug)
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Preparar y Renombrar Archivo APK
        run: |
          mkdir -p release-apk
          APK_PATH=$(find android/app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          if [ -f "$APK_PATH" ]; then
            cp "$APK_PATH" release-apk/MundoCases-Inventario-v1.0.apk
            echo "APK generado con éxito: release-apk/MundoCases-Inventario-v1.0.apk"
          else
            echo "Error: no se encontró el APK generado"
            exit 1
          fi

      - name: Subir APK como Artefacto de GitHub
        uses: actions/upload-artifact@v4
        with:
          name: MundoCases-Inventario-APK
          path: release-apk/MundoCases-Inventario-v1.0.apk
          retention-days: 30

      - name: Eliminar Release Anterior si Existe
        run: |
          gh release delete v1.0.0 --yes 2>/dev/null || true
          git push origin :refs/tags/v1.0.0 2>/dev/null || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publicar Release Automatica con APK Descargable
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.0.0
          name: "Mundo Cases Inventario v1.0.0 (APK Móvil)"
          body: |
            ## 📱 APK de Control de Inventario para Mundo Cases
            
            ¡La APK móvil para Android está lista para descargar e instalar en cualquier celular o tablet Android!
            
            ### ✨ Características incluidas:
            - **Control de Inventario Completo:** Agregar, modificar y eliminar artículos.
            - **Campos registrados:** Marca, Modelo, Categoría, Precio de venta, Costo, Unidades Disponibles (Stock), Ubicación y Código SKU.
            - **Ajuste Rápido de Stock:** Botones directos `+` y `-` para ventas y reposiciones instantáneas.
            - **Interfaz moderna** con logo de Mundo Cases integrado.
            - **Base de Datos Local y Fácil de Manipular (IndexedDB/Dexie):**
              - Funciona 100% offline sin necesidad de servidores costosos.
              - Exportación e importación instantánea a **JSON** para copias de seguridad.
              - Exportación a **CSV compatible con Excel** para informes y manipulación masiva.
            - **Dashboard de Métricas:** Total de modelos, stock global, valor monetario del inventario y alertas de stock bajo (< 5 unidades).
            
            ### 📥 Instrucciones de Instalación:
            1. Descarga el archivo adjunto `MundoCases-Inventario-v1.0.apk` en tu dispositivo Android.
            2. Pulsa en el archivo descargado para instalarlo (habilita la opción *"Permitir instalar aplicaciones de orígenes desconocidos"* en tu teléfono si te lo solicita).
            3. ¡Listo! Tendrás la aplicación instalada en tu dispositivo.
          files: release-apk/MundoCases-Inventario-v1.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
